# 网页桌面里的「← 状态页」小按钮：贴在页面顶边正中，点一下回到连接器状态页（/wxc/）。
# 网页桌面的页面是镜像自带的，这里不改它的文件，只在 nginx 往外发首页时在 </body> 前插一个链接。
# 由 /defaults/default.conf 里网页桌面那个 location include 进来。单独放一个文件，是因为镜像的启动脚本
# 会对站点配置做整段替换（设了密码时连「#」都会删掉），按钮的样式写在站点配置里会被改坏。
sub_filter '</body>' '<a id="wxc-back" href="wxc/" title="回到连接器状态页" style="position:fixed;z-index:99999;top:0;left:50%;transform:translateX(-50%);padding:2px 12px 4px;font:12px/1.5 system-ui,-apple-system,sans-serif;color:#fff;background:rgba(24,24,27,.6);border:1px solid rgba(255,255,255,.28);border-top:0;border-radius:0 0 8px 8px;text-decoration:none;opacity:.6;user-select:none" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=.6">← 状态页</a></body>';
sub_filter_once on;
# 不发 ETag：否则浏览器拿着以前缓存的首页来问「变了没」，nginx 会回 304，按钮就一直出不来
etag off;
